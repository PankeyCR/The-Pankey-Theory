name: Deploy Resolution Desk

on:
  push:
    branches: [master]
    paths:
      - 'Projects/ai-limits-review-hub/**'
      - '.github/workflows/deploy-resolution-desk.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Projects/ai-limits-review-hub
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
